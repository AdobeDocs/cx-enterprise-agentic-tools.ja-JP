  <text x="635" y="626" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">AI-assisted development ready</text>

  <text x="800" y="738" text-anchor="middle" fill="#1473E6" fill-opacity="0.6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2">FOR DEVELOPERS</text>

  <!-- Connector 2 -->
  <circle cx="1030" cy="525" r="16" fill="white" fill-opacity="0.04"
