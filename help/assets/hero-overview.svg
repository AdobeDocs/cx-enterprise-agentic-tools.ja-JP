  <circle cx="340" cy="375" r="9" fill="#EB1000"/>
  <circle cx="340" cy="343" r="6" fill="#EB1000" fill-opacity="0.75"/>
  <circle cx="368" cy="391" r="6" fill="#EB1000" fill-opacity="0.75"/>
  <circle cx="312" cy="391" r="6" fill="#EB1000" fill-opacity="0.75"/>
  <line x1="340" y1="366" x2="340" y2="349" stroke="#EB1000" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="348" y1="382" x2="362" y2="388" stroke="#EB1000" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="332" y1="382" x2="318" y2="388" stroke="#EB1000" stroke-width="2" stroke-opacity="0.6"/>

