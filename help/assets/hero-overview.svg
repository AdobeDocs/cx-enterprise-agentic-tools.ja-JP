  <text x="340" y="502" text-anchor="middle" fill="#7A9FBF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Any compatible AI client</text>

  <circle cx="162" cy="543" r="3" fill="#EB1000" fill-opacity="0.75"/>
  <text x="175" y="548" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">No coding required</text>
  <circle cx="162" cy="582" r="3" fill="#EB1000" fill-opacity="0.75"/>
  <text x="175" y="587" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Query Adobe data in plain language</text>
  <circle cx="162" cy="621" r="3" fill="#EB1000" fill-opacity="0.75"/>
  <text x="175" y="626" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
