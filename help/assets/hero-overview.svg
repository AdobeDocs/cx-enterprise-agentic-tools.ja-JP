<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091425"/>
      <stop offset="100%" stop-color="#152845"/>
    </linearGradient>
    <linearGradient id="div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EB1000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EB1000" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1473E6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1473E6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7E4DD2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7E4DD2" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Soft glow behind each card -->
  <circle cx="340" cy="525" r="270" fill="#EB1000" fill-opacity="0.07"/>
  <circle cx="800" cy="525" r="270" fill="#1473E6" fill-opacity="0.07"/>
  <circle cx="1260" cy="525" r="270" fill="#7E4DD2" fill-opacity="0.07"/>

  <!-- Header -->
  <text x="800" y="140" text-anchor="middle" fill="white"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700">Adobe CX Enterprise Agentic Tools</text>
  <text x="800" y="195" text-anchor="middle" fill="#7A9FBF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22">Connect AI agents to Adobe CX Enterprise data, workflows, and automation</text>
  <line x1="580" y1="228" x2="1020" y2="228" stroke="url(#div)" stroke-width="1"/>
  <text x="800" y="258" text-anchor="middle" fill="#4A6A8A"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" letter-spacing="2">THREE WAYS TO CONNECT</text>

  <!-- ==================== CARD 1: MCP SERVERS (x=130, y=280) ==================== -->
  <rect x="130" y="280" width="420" height="490" rx="14"
        fill="url(#gr)" stroke="#EB1000" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="130" y="280" width="420" height="5" rx="3" fill="#EB1000"/>

  <!-- Network icon -->
  <circle cx="340" cy="375" r="52" fill="#EB1000" fill-opacity="0.12"
