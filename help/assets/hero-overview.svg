  <circle cx="570" cy="525" r="16" fill="white" fill-opacity="0.04"
          stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="570" y="531" text-anchor="middle" fill="white" fill-opacity="0.35"
        font-family="-apple-system, sans-serif" font-size="20" font-weight="300">+</text>

