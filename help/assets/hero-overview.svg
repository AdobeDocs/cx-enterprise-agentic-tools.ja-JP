  <circle cx="800" cy="375" r="52" fill="#1473E6" fill-opacity="0.12"
          stroke="#1473E6" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M776 367 L762 375 L776 383" stroke="#1473E6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M824 367 L838 375 L824 383" stroke="#1473E6" stroke-width="3"
