  <!-- Row 1 (y=350-364, centered at 357) -->
  <rect x="1236" y="350" width="48" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.2"/>
  <rect x="1236" y="350" width="16" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.65"/>
  <path d="M1241 357 L1244 360 L1250 354" stroke="white" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <!-- Row 2 (y=368-382, centered at 375) -->
  <rect x="1236" y="368" width="48" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.2"/>
  <rect x="1236" y="368" width="16" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.65"/>
  <path d="M1241 375 L1244 378 L1250 372" stroke="white" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <!-- Row 3 (y=386-400, centered at 393) -->
  <rect x="1236" y="386" width="48" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.2"/>
  <rect x="1236" y="386" width="16" height="14" rx="3" fill="#7E4DD2" fill-opacity="0.65"/>
  <path d="M1241 393 L1244 396 L1250 390" stroke="white" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <text x="1260" y="468" text-anchor="middle" fill="white"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700">Agent Skills</text>
  <text x="1260" y="502" text-anchor="middle" fill="#7A9FBF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Adobe-curated workflows</text>

  <circle cx="1082" cy="543" r="3" fill="#7E4DD2" fill-opacity="0.75"/>
  <text x="1095" y="548" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Domain expertise built in</text>
  <circle cx="1082" cy="582" r="3" fill="#7E4DD2" fill-opacity="0.75"/>
  <text x="1095" y="587" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Consistent, repeatable results</text>
  <circle cx="1082" cy="621" r="3" fill="#7E4DD2" fill-opacity="0.75"/>
  <text x="1095" y="626" fill="#B8CCE0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Works with any compatible agent</text>

  <text x="1260" y="738" text-anchor="middle" fill="#7E4DD2" fill-opacity="0.6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2">FOR ALL USERS</text>

  <!-- Bottom tagline -->
  <text x="800" y="845" text-anchor="middle" fill="white" fill-opacity="0.18"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15">Use them independently or together</text>
</svg>
